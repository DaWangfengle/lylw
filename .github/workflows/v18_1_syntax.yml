name: V18.1 verification

on:
  push:
    branches:
      - v18-1-single-member
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile V18.1 sources
        run: |
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_1_single.py
          python -m py_compile fhm_dapp_tim/fhm_dapp/uji_v18_1_experiment.py
          python -m py_compile tests/test_uji_v18_1_experiment.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run V18.1 contract tests
        run: |
          python -m pytest -q tests/test_coherent_marked_v9.py tests/test_uji_v18_experiment.py tests/test_uji_v18_1_experiment.py
