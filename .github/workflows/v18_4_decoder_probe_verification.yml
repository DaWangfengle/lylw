name: V18.4 decoder-probe verification

on:
  push:
    branches:
      - v18-4-trust-region-posterior
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile probe
        run: |
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_4_decoder_probe.py
          python -m py_compile tests/test_v18_4_decoder_probe.py
      - name: Run V18.4 diagnostic-gate tests
        run: |
          python -m pytest -q tests/test_v18_4_decoder_probe.py tests/test_uji_v18_3_experiment.py
