name: V17 two-stage frozen-calibration validation

on:
  push:
    branches:
      - v17-two-stage-frozen-calibration-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile the new experiment and tests
        run: |
          python -m py_compile fhm_dapp_tim/fhm_dapp/msep_v17_two_stage_freeze_v1.py
          python -m py_compile tests/test_msep_v17_two_stage_freeze_v1.py
      - name: Run the closeout contract tests
        run: |
          python -m pytest -q tests/test_msep_v17_two_stage_freeze_v1.py tests/test_msep_joint_ablation_v1.py
