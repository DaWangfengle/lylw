name: V18.4 training-data audit

on:
  push:
    branches:
      - v18-4-trust-region-posterior
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy pytest
      - name: Compile audit
        run: |
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_4_dataset_audit.py
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_4_datasets.py
          python -m py_compile tests/test_v18_4_datasets.py
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_4_protocol.py
          python -m py_compile tests/test_v18_4_protocol.py
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_4_capacity_audit.py
          python -m py_compile tests/test_v18_4_capacity_audit.py
      - name: Audit training sources only
        run: |
          python fhm_dapp_tim/fhm_dapp/v18_4_dataset_audit.py --output /tmp/v18_4_dataset_audit.json
          echo "AUDIT_JSON_BEGIN"
          cat /tmp/v18_4_dataset_audit.json
          echo "AUDIT_JSON_END"

      - name: Run training-only canonical adapter tests
        run: |
          python -m pytest -q tests/test_v18_4_datasets.py
      - name: Print training-only canonical dataset summary
        run: |
          echo "CANONICAL_SUMMARY_BEGIN"
          python fhm_dapp_tim/fhm_dapp/v18_4_datasets.py
          echo "CANONICAL_SUMMARY_END"

      - name: Run grouped-role protocol tests
        run: |
          python -m pytest -q tests/test_v18_4_protocol.py
      - name: Print registered role manifest
        run: |
          echo "ROLE_MANIFEST_BEGIN"
          python fhm_dapp_tim/fhm_dapp/v18_4_protocol.py
          echo "ROLE_MANIFEST_END"

      - name: Run pretraining capacity-contract tests
        run: |
          python -m pytest -q tests/test_v18_4_capacity_audit.py
      - name: Print candidate-capacity manifest
        run: |
          echo "CAPACITY_MANIFEST_BEGIN"
          python fhm_dapp_tim/fhm_dapp/v18_4_capacity_audit.py
          echo "CAPACITY_MANIFEST_END"
