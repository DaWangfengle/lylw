name: V18.5 verification

on:
  push:
    branches:
      - v18-5-joint-radio-calibration
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile V18.5 implementation
        run: |
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_5_core.py
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_5_datasets.py
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_5_radio.py
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_5_model.py
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_5_protocol.py
          python -m py_compile fhm_dapp_tim/fhm_dapp/uji_v18_5_development.py
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_5_realdata_smoke.py
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_5_revision_audit.py
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_5_external.py
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_5_artifact_audit.py
          python -m py_compile fhm_dapp_tim/fhm_dapp/v18_5_external_artifact_audit.py

      - name: Run V18.5 contract tests
        run: |
          python -m pytest -q \
            tests/test_v18_5_core.py \
            tests/test_v18_5_datasets.py \
            tests/test_v18_5_radio.py \
            tests/test_v18_5_model.py \
            tests/test_v18_5_protocol.py \
            tests/test_uji_v18_5_development.py \
            tests/test_v18_5_revision_audit.py \
            tests/test_v18_5_external.py \
            tests/test_v18_5_artifact_audit.py \
            tests/test_v18_5_external_artifact_audit.py

      - name: Real UJI training-only CPU smoke
        run: |
          python -m fhm_dapp_tim.fhm_dapp.v18_5_realdata_smoke --device cpu

      - name: Training-only multi-dataset audit
        run: |
          python -m fhm_dapp_tim.fhm_dapp.v18_5_revision_audit \
            --skip-smoke \
            --json /tmp/PRE_RUN_AUDIT_V18_5.json \
            --markdown /tmp/PRE_RUN_AUDIT_V18_5.md
          echo "V18_5_AUDIT_BEGIN"
          cat /tmp/PRE_RUN_AUDIT_V18_5.json
          echo "V18_5_AUDIT_END"
