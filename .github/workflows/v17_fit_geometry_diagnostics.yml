name: Temporary V17 FIT geometry diagnostics

on:
  push:
    branches:
      - v17-dataset-adaptive-spatial-joint-fit-v1
  workflow_dispatch:

jobs:
  fit-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compute FIT geometry quantiles
        run: |
          python -m py_compile fhm_dapp_tim/fhm_dapp/msep_v17_dataset_adaptive_joint_fit_v1.py
          python -m fhm_dapp_tim.fhm_dapp.msep_v17_dataset_adaptive_joint_fit_v1 preflight --input-root fhm_dapp_tim/evidence/v17_two_stage_freeze_v1 --output /tmp/v17_fit_geometry
          python - <<'PY'
          import json
          p = "/tmp/v17_fit_geometry/FIT_NEIGHBOR_DISTANCE_DIAGNOSTICS.json"
          obj = json.load(open(p, encoding="utf-8"))
          all_runs = obj["datasets_and_seeds"]
          for dataset in ("tuji", "uts", "uji"):
              key = next(k for k in all_runs if k.startswith(dataset + "_seed"))
              d = all_runs[key]
              print("FIT_GEOMETRY_SUMMARY " + json.dumps({
                  "dataset": dataset,
                  "anchors": d["anchors"],
                  "building_floor_strata": d["building_floor_strata"],
                  "zero_distance_pairs": d["zero_distance_pairs_within_building_floor"],
                  "kth_neighbor_distance_m": d["kth_neighbor_distance_m"],
                  "kth_neighbor_threshold_counts": d["kth_neighbor_threshold_counts"],
                  "union_knn_edge_distance_m": d["base_union_knn_edge_distance_m"],
                  "union_knn_edge_threshold_counts": d["base_union_knn_edge_threshold_counts"],
                  "exp_neg_distance_over_8_at_quantiles": d["exp_neg_distance_over_8_at_quantiles"]
              }, ensure_ascii=False))
          PY
